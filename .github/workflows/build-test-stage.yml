name: Build, Test and Stage Docker Image

on:
  workflow_call:
    inputs:
      image_type:
        description: 'Type of image to build'
        type: string
        required: true
      matlab_release:
        description: 'MATLAB Release (e.g., R2025b)'
        type: string
        required: true
      databricks_runtime:
        description: 'Databricks Runtime Version (e.g., 17.3)'
        type: string
        required: true
    secrets:
      MATLAB_LICENSE_FILE:
        required: false

env:
  # Specify the registry to release to.
  # For example to push to Azure Container Registry: <your-acr-name>.azurecr.io
  REGISTRY: ghcr.io
  REPO_NAME: ${{ github.repository }}

jobs:
  build-test-stage:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Free up disk space
        run: |
          sudo rm -rf \
            "$AGENT_TOOLSDIRECTORY" \
            /opt/google/chrome \
            /opt/microsoft/msedge \
            /opt/microsoft/powershell \
            /opt/pipx \
            /usr/lib/mono \
            /usr/local/julia* \
            /usr/local/lib/android \
            /usr/local/lib/node_modules \
            /usr/local/share/chromium \
            /usr/local/share/powershell \
            /usr/share/dotnet \
            /usr/share/swift
          df -h /

      - name: Configure build environment
        id: config
        shell: bash
        run: |
          # Determine Ubuntu Version based on Databricks Runtime Major Version
          DBR_MAJOR=$(echo "${{ inputs.databricks_runtime }}" | cut -d. -f1)
          if [ "$DBR_MAJOR" -ge 16 ]; then
            UBUNTU_VERSION="24.04"
          else
            UBUNTU_VERSION="22.04"
          fi

          {
            echo "IMAGE_NAME=${{ env.REPO_NAME }}/test-${{ inputs.image_type }}"
            echo "BUILD_CONTEXT=resources/dockerfiles/${{ inputs.image_type }}"
            echo "DATABRICKS_RUNTIME_VERSION=${{ inputs.databricks_runtime }}"
            echo "UBUNTU_VERSION=${UBUNTU_VERSION}"
          } >> "$GITHUB_ENV"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v4
        with:
          registry: ${{ env.REGISTRY }}
          # Update the username & password for your registry
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata (tags, labels) for Docker
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=raw,value=${{ inputs.matlab_release }}-${{ inputs.databricks_runtime }}

      - name: Build and Load image
        uses: docker/build-push-action@v7
        with:
          context: "{{defaultContext}}:${{ env.BUILD_CONTEXT }}"
          build-args: |
            MATLAB_RELEASE=${{ inputs.matlab_release }}
            DATABRICKS_RUNTIME_VERSION=${{ env.DATABRICKS_RUNTIME_VERSION }}
            UBUNTU_VERSION=${{ env.UBUNTU_VERSION }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          load: true
          cache-from: type=gha,scope=${{ inputs.image_type }}-${{ inputs.matlab_release }}-${{ inputs.databricks_runtime }}
          cache-to: type=gha,mode=max,scope=${{ inputs.image_type }}-${{ inputs.matlab_release }}-${{ inputs.databricks_runtime }}

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.11'

      - name: Install test dependencies
        run: |
          python3 -m pip install --upgrade pip
          python3 -m pip install -r tests/docker/requirements.txt

      - name: Run local docker tests
        run: python3 -m pytest tests/docker/${{ inputs.image_type }}
        env:
          IMAGE_NAME: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${{ inputs.matlab_release }}-${{ inputs.databricks_runtime }}
          MATLAB_RELEASE: ${{ inputs.matlab_release }}
          DB_RUNTIME: ${{ inputs.databricks_runtime }}
          MATLAB_LICENSE_FILE: ${{ secrets.MATLAB_LICENSE_FILE }}

      - name: Push to Registry
        if: success()
        run: |
          echo "${{ steps.meta.outputs.tags }}" | xargs -I {} docker push {}
