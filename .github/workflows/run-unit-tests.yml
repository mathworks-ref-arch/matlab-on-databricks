name: Run Unit Tests

on:
  workflow_call:
  workflow_dispatch:

jobs:
  shell_script_tests:
    timeout-minutes: 5
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Setup Bats
        id: setup-bats
        uses: bats-core/bats-action@4.0.0
        with:
          # Need only support and assert libraries. Install locally for caching to work.
          # See https://github.com/brokenpip3/setup-bats-libs/issues/18
          support-path: ${{ github.workspace }}/.bats/bats-support
          assert-path: ${{ github.workspace }}/.bats/bats-assert
          detik-install: false
          file-install: false

      - name: Run tests
        env:
          SOURCE_SCRIPTS_DIR: ${{ github.workspace }}/resources/notebooks/mwhelpers/scripts
          TEST_SCRIPTS_DIR: ${{ github.workspace }}/tests/unit/shell
          BATS_LIB_PATH: ${{ github.workspace }}/.bats
        run: bats "$TEST_SCRIPTS_DIR"

  python_tests:
    timeout-minutes: 15
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.11", "3.12"]
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install dependencies
        run: |
          python3 -m pip install --upgrade pip
          python3 -m pip install -r tests/unit/python/requirements.txt

      - name: Run tests and report coverage
        run: python3 -m pytest --cov=resources/notebooks/ tests/unit/python
