name: Run System Tests

on:
  workflow_call:
    inputs:
      docker_image:
        description: "Full Docker image URL accessible from Databricks (e.g., ghcr.io/org/repo/matlab:R2026a-17.3)"
        type: string
        required: true
      matlab_release:
        description: "MATLAB Release (e.g., R2026a)"
        type: string
        required: true
      databricks_runtime:
        description: "Databricks Runtime Version (e.g., 17.3)"
        type: string
        required: true
    secrets:
      DATABRICKS_HOST:
        required: true
      DATABRICKS_CLIENT_ID:
        required: true
      DATABRICKS_CLIENT_SECRET:
        required: true
      MATLAB_LICENSE_FILE:
        required: true

  workflow_dispatch:
    inputs:
      docker_image:
        description: "Full Docker image URL accessible from Databricks (e.g., ghcr.io/org/repo/matlab:R2026a-17.3)"
        type: string
        required: true
      matlab_release:
        description: "MATLAB Release (e.g., R2026a)"
        type: string
        default: 'R2026a'
        required: true
      databricks_runtime:
        description: "Databricks Runtime Version (e.g., 17.3)"
        type: string
        default: '17.3'
        required: true

permissions:
  contents: read
  packages: read

jobs:
  system_tests:
    if: ${{ github.event.repository.private }}
    timeout-minutes: 30
    runs-on: ubuntu-latest

    env:
      DATABRICKS_HOST: ${{ secrets.DATABRICKS_HOST }}
      DATABRICKS_CLIENT_ID: ${{ secrets.DATABRICKS_CLIENT_ID }}
      DATABRICKS_CLIENT_SECRET: ${{ secrets.DATABRICKS_CLIENT_SECRET }}
      BUNDLE_VAR_docker_image: ${{ inputs.docker_image }}
      BUNDLE_VAR_docker_username: ${{ github.actor }}
      BUNDLE_VAR_docker_password: ${{ secrets.GITHUB_TOKEN }}
      BUNDLE_VAR_matlab_release: ${{ inputs.matlab_release }}
      BUNDLE_VAR_databricks_runtime: ${{ inputs.databricks_runtime }}
      BUNDLE_VAR_run_id: ${{ github.run_id }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Install Databricks CLI
        uses: databricks/setup-cli@v1.2.1

      - name: Upload MATLAB license to Databricks secrets
        env:
          MATLAB_LICENSE: ${{ secrets.MATLAB_LICENSE_FILE }}
        run: make -C tests/system upload-license

      - name: Deploy bundle
        run: make -C tests/system deploy

      - name: Run tests
        run: make -C tests/system test

      - name: Destroy bundle
        if: always()
        run: make -C tests/system destroy
