# Copyright 2026 The MathWorks, Inc.
name: Release Publish

on:
  push:
    tags: ["v*"]

  # Run at 00:00 on every Monday (1st Day of the Week) (See: crontab.guru)
  schedule:
    - cron: '0 0 * * 1'

  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  # ----------------------------------------------------------------
  # MATLAB IMAGES (5 Releases x 2 DBRs)
  # ----------------------------------------------------------------
  matlab:
    name: MATLAB ${{ matrix.matlab_release }} (DBR ${{ matrix.databricks_runtime }})
    strategy:
      fail-fast: false
      matrix:
        matlab_release: ['R2024a', 'R2024b', 'R2025a', 'R2025b', 'R2026a']
        databricks_runtime: ['17.3', '16.4']
        include:
          - matlab_release: 'R2024b'
            databricks_runtime: '17.3'
            matlab_update: 'U7'
          - matlab_release: 'R2024b'
            databricks_runtime: '16.4'
            matlab_update: 'U7'
    uses: ./.github/workflows/docker-pipeline.yml
    with:
      image_type: 'matlab'
      matlab_release: ${{ matrix.matlab_release }}
      matlab_update: ${{ matrix.matlab_update }}
      databricks_runtime: ${{ matrix.databricks_runtime }}
      run_integration: true
      promote: true
    secrets: inherit

  # ----------------------------------------------------------------
  # RUNTIME IMAGES (1 Release x 1 DBR)
  # ----------------------------------------------------------------
  runtime:
    name: MATLAB Runtime R2026a (DBR 17.3)
    uses: ./.github/workflows/docker-pipeline.yml
    with:
      image_type: 'runtime'
      matlab_release: 'R2026a'
      databricks_runtime: '17.3'
      promote: true
    secrets: inherit

  # ----------------------------------------------------------------
  # SYSTEM TESTS (oldest + latest MATLAB releases only)
  # ----------------------------------------------------------------
  system_tests:
    name: System Test MATLAB ${{ matrix.matlab_release }} (DBR ${{ matrix.databricks_runtime }})
    needs: matlab
    if: ${{ !cancelled() && github.event_name != 'schedule' }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - matlab_release: 'R2024b'
            databricks_runtime: '16.4'
          - matlab_release: 'R2026a'
            databricks_runtime: '17.3'
    uses: ./.github/workflows/run-system-tests.yml
    with:
      docker_image: ${{ format('ghcr.io/{0}/matlab:{1}-{2}', github.repository, matrix.matlab_release, matrix.databricks_runtime) }}
      matlab_release: ${{ matrix.matlab_release }}
      databricks_runtime: ${{ matrix.databricks_runtime }}
    secrets: inherit
