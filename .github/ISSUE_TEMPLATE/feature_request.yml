name: Feature Request
description: Suggest a feature for this project. 
title: "<Enter short description>"
labels: [feature-request, needs-triage]
body:
  - type: markdown
    attributes:
      value: |
        This section is to report a feature request. To report a bug or security vulnerability instead, return to [Create an Issue](https://github.com/mathworks-ref-arch/matlab-on-databricks/issues/new/choose).
        
        Do not include sensitive information in the feature request. If you need to share sensitive information, please contact [databricks@mathworks.com](mailto:databricks@mathworks.com).

  - type: textarea
    id: feature-summary
    attributes:
      label: A brief description of the feature you are proposing
      description: A clear and concise description of what the feature is.
    
  - type: textarea
    id: use-case
    attributes:
      label: What use case or challenge would this help you overcome?
      description: For example, “currently, it is too time-consuming/difficult to do xyz.”

  - type: textarea
    id: suggestions
    attributes:
      label: Suggestions for implementing the request
      description: Provide a prototype, sketch, reference etc, if possible. 

  - type: textarea
    id: additional-info
    attributes:
      label: Any additional information
      description: Details, stack traces, related issues, links for context, etc.
